services:
  - type: web
    name: burtsevwerk
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
  - type: web
    name: burtsevwerk-api
    runtime: node
    rootDir: server
    buildCommand: echo ok
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
